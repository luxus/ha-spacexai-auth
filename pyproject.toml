[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ha-spacexai-auth"
version = "0.1.0"
description = "Shared SpaceXAI/xAI Grok OAuth helpers for Home Assistant integrations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "luxus" }]
keywords = ["homeassistant", "spacexai", "xai", "grok", "oauth", "device-flow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/luxus/ha-spacexai-auth"
Source = "https://github.com/luxus/ha-spacexai-auth"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ha_spacexai_auth"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
